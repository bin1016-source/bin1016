    function initMap() {
      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 37.5450, lng: 126.9850 },
        zoom: 12,
        mapTypeId: "roadmap"
      });

      const infoWindow = new google.maps.InfoWindow();

      hospitals.forEach((h) => {
        const position = { lat: h.lat, lng: h.lng };

        const marker = new google.maps.Marker({
          position: position,
          map: map,
          title: h.name,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 9,
            fillColor: h.available ? "#16a34a" : "#dc2626",
            fillOpacity: 0.95,
            strokeColor: "#ffffff",
            strokeWeight: 2
          }
        });

        new google.maps.Circle({
          map: map,
          center: position,
          radius: 3000,
          strokeColor: "#2563eb",
          strokeOpacity: 0.75,
          strokeWeight: 1.5,
          fillColor: "#3b82f6",
          fillOpacity: 0.08
        });

        marker.addListener("click", () => {
          infoWindow.setContent(
            `<div style="font-family: 'Malgun Gothic', sans-serif; min-width: 210px; padding: 4px;">
              <div style="font-size: 14px; font-weight: bold; margin-bottom: 6px;">${h.name}</div>
              <div style="font-size: 12px; color: #555; margin-bottom: 6px;"><b>주소:</b> ${h.addr}</div>
              <hr style="border: 0; border-top: 1px solid #ddd; margin: 6px 0;"/>
              <div style="font-size: 13px;"><b>상태:</b> ${h.status}</div>
            </div>`
          );
          infoWindow.open(map, marker);
        });
      });
    }
